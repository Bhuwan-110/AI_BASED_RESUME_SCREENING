<!-- GURUKUL Admin Navigation Sub-Bar -->
<div class="gk-admin-nav mb-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
  <div class="d-flex flex-wrap align-items-center gap-1">
    <a href="{% url 'accounts:admin_dashboard' %}" class="gk-admin-tab {% if active_admin_tab == 'dashboard' %}active{% endif %}">
      <i class="bi bi-speedometer2"></i> Dashboard
    </a>
    <a href="{% url 'jobs:manage_jobs' %}" class="gk-admin-tab {% if active_admin_tab == 'jobs' %}active{% endif %}">
      <i class="bi bi-briefcase"></i> Jobs
    </a>
    <a href="{% url 'applications:admin_applicants' %}" class="gk-admin-tab {% if active_admin_tab == 'applicants' %}active{% endif %}">
      <i class="bi bi-people"></i> Applicants
    </a>
    <a href="{% url 'accounts:profile' %}" class="gk-admin-tab {% if active_admin_tab == 'profile' %}active{% endif %}">
      <i class="bi bi-person-gear"></i> Profile
    </a>
  </div>

  <div class="d-flex align-items-center gap-2">
    <a href="{% url 'jobs:create_job' %}" class="btn btn-sm btn-primary">
      <i class="bi bi-plus-circle me-1"></i> Post Job
    </a>
    <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#adminLogoutModal">
      <i class="bi bi-box-arrow-right me-1"></i> Logout
    </button>
  </div>
</div>

<!-- Logout Confirmation Modal -->
<div class="modal fade" id="adminLogoutModal" tabindex="-1" aria-labelledby="adminLogoutModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow">
      <div class="modal-header border-bottom">
        <h5 class="modal-title fw-bold text-dark" id="adminLogoutModalLabel">
          <i class="bi bi-box-arrow-right text-danger me-2"></i> Confirm Sign Out
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body py-4">
        <p class="mb-0 text-secondary">
          Are you sure you want to end your administrative session? Any unsaved changes in candidate reviews will need to be re-entered.
        </p>
      </div>
      <div class="modal-footer border-top bg-light">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <a href="{% url 'accounts:logout' %}" class="btn btn-danger">
          <i class="bi bi-box-arrow-right me-1"></i> Yes, Sign Out
        </a>
      </div>
    </div>
  </div>
</div>
